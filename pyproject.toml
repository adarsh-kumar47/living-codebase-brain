[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-codebase-brain"
version = "0.1.0"
description = "A Neo4j code graph of a JVM codebase and its history, for LLMs (MCP) and change warnings."
requires-python = ">=3.10"
dependencies = [
    "neo4j==5.26.0",
    "mcp==2.2.0",
]

[project.optional-dependencies]
bench = ["tiktoken==0.8.0"]

[project.scripts]
lcb = "lcb.__main__:main"

[tool.setuptools]
packages = ["lcb"]
